<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poetry Shelf | Random Poems</title>
    <meta name="description" content="A small PoetryDB browser built for COSC 484L Lab Exercise 08." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container py-2">
          <div class="brand-lockup">
            <a class="navbar-brand" href="index.html">
              <svg class="brand-mark" viewBox="0 0 48 36" aria-hidden="true">
                <path d="M4 7c8-3 14-1 20 4v20c-6-5-12-7-20-4V7Z" fill="#fff" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
                <path d="M44 7c-8-3-14-1-20 4v20c6-5 12-7 20-4V7Z" fill="#fff" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
                <path d="M24 11v20" fill="none" stroke="currentColor" stroke-width="2.5" />
              </svg>
              <span>Poetry Shelf</span>
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4">
      <section class="intro-block mb-5">
        <h1>Random poems from PoetryDB</h1>
        <p class="intro-copy">Browse a few random poems from PoetryDB. Choose one to read the full poem.</p>
        <button class="btn btn-ink" id="refreshButton" type="button">Load another set</button>
      </section>

      <div id="statusMessage" class="status-message" role="status" aria-live="polite">Loading poems…</div>
      <section id="poemGrid" class="row g-4" aria-label="Random poems"></section>
    </main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>Data from PoetryDB · Zain Mayoof</span>
        <a href="https://github.com/thundercomb/poetrydb" target="_blank" rel="noreferrer">API documentation</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
